name: Update Nara Kids events
on:
  schedule:
    - cron: '15 20 * * *' # Daily around 05:15 JST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r nara-kids-v2/requirements.txt
      - run: python nara-kids-v2/scripts/update_events.py
      - run: python nara-kids-v2/scripts/build_weekly.py
      - name: Publish changed event data
        run: |
          if ! git diff --quiet -- nara-kids-v2/events.json nara-kids-v2/weekly.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add nara-kids-v2/events.json nara-kids-v2/weekly.json
            git commit -m 'Refresh Nara events and weekend guide'
            git push
          fi
