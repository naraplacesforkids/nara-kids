name: Update Nara Kids events
on:
  schedule:
    - cron: '15 20 * * *' # 05:15 Japan Standard Time, daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/update_events.py
      - name: Commit refreshed event feed
        run: |
          if ! git diff --quiet -- events.json; then
            git config user.name 'nara-kids-bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add events.json
            git commit -m 'Refresh Nara Kids events'
            git push
          fi
