<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#245c49"><title>This Weekend | Nara Kids</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#173d30;background:#f6f9f5}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#184936,#388466);color:#fff;padding:24px max(20px,calc((100vw - 890px)/2))}main{max-width:920px;margin:auto;padding:20px 16px 65px}h1{margin:10px 0;font-size:clamp(28px,5vw,42px)}h2{font-size:24px}a{color:#246a4b}header a{color:#fff}select{padding:10px;border-radius:10px;border:0}section{margin:18px 0}.card{background:#fff;border:1px solid #dfe9e2;border-radius:16px;padding:18px;margin:12px 0}.meta{color:#426f59;font-size:14px}.detail{margin:8px 0;line-height:1.55}.tag{background:#e8f4eb;display:inline-block;border-radius:12px;padding:5px 9px;font-size:12px;font-weight:600}.badges{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.badge{background:#e9f3ee;border-radius:100px;font-weight:650;font-size:12px;padding:5px 9px}.badge.ends{background:#fff0d2}.badge.free{background:#def2e4}.badge.unknown{background:#edf0ed}.muted{color:#62756b;font-size:13px;line-height:1.6}.notice{background:#fff3da;border-radius:12px;padding:15px;line-height:1.6}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.btn{display:inline-block;background:#205b46;color:#fff;padding:10px 13px;border-radius:10px;text-decoration:none;margin-top:8px}.empty{background:white;padding:22px;border:1px solid #dae9df;border-radius:12px}footer{text-align:center;color:#688272;padding:20px}h3{margin:8px 0}</style></head><body><header><div class="top"><a href="./">← 🦌 Nara Kids</a><select id="lang" aria-label="Language"><option value="en">English</option><option value="ja">日本語</option><option value="ht">Kreyòl ayisyen</option><option value="fr">Français</option><option value="ne">नेपाली</option><option value="hi">हिन्दी</option></select></div><h1 id="heading"></h1><p id="tagline"></p></header><main><div class="notice" id="caution"></div><h2 id="dates"></h2><p id="status" class="muted"></p><div id="list"></div><section><h2 id="linksTitle"></h2><p class="muted" id="linksText"></p><p><a href="https://www.city.kashihara.nara.jp/calendar.html" target="_blank" rel="noopener">橿原市</a> · <a href="https://www.city.nara.lg.jp/calendar/" target="_blank" rel="noopener">奈良市</a> · <a href="https://www.pref.nara.lg.jp/cgi-bin/event_cal_multi/calendar.cgi" target="_blank" rel="noopener">奈良県</a></p></section></main><footer>🦌 Nara Kids · Source-linked family event leads</footer><script>

ja:['今週末の奈良おでかけ情報','土日と月曜日のおでかけ候補をチェック！','この情報は一部の公開情報源から自動収集したもので、個別に確認済みではありません。時間・料金・対象年齢・予約・中止情報は必ず主催者の公式サイトで確認してください。月曜日は必ずしも祝日ではありません。','公式イベントカレンダー','掲載していないイベントもあります。公式情報もご覧ください。','接続済みの情報源から、この週末の該当イベントは見つかりませんでした。イベントがないという意味ではありません。','公式情報を見る →','時間：公式サイトで確認','料金：公式サイトで確認','年齢：公式サイトで確認','予約：公式サイトで確認','更新日時','イベントの詳しい説明は未掲載です。公式ページでご確認ください。'],
ht:['Aktivite wikenn nan Nara','Evènman fanmi pou samdi, dimanch ak lendi.','Lis sa yo soti otomatikman nan kèk sous piblik; yo poko verifye. Tcheke lè, pri, laj, rezèvasyon ak anilasyon sou sit òganizatè a. Lendi pa toujou yon jou ferye.','Kalandriye ofisyèl','Gen lòt evènman ki ka sou sit ofisyèl yo.','Nou pa jwenn evènman nan sous ki konekte yo pou wikenn sa a. Sa pa vle di pa gen aktivite.','Detay ofisyèl →','Lè: verifye sou sit la','Pri: verifye sou sit la','Laj: verifye sou sit la','Rezèvasyon: verifye sou sit la','Dènye mizajou','Òganizatè a poko bay yon deskripsyon kout. Gade paj ofisyèl la pou detay yo.'],
fr:['Ce week-end à Nara','Sorties en famille samedi, dimanche et lundi.','Ces événements proviennent automatiquement de quelques sources publiques et ne sont pas vérifiés individuellement. Confirmez horaires, tarifs, âges, réservations et annulations auprès des organisateurs. Le lundi n’est pas nécessairement férié.','Calendriers officiels','D’autres événements peuvent figurer sur les sites officiels.','Aucun événement trouvé dans les sources connectées pour ce week-end. Cela ne signifie pas qu’il n’y en a pas.','Détails officiels →','Horaire : voir le site officiel','Tarif : voir le site officiel','Âge : voir le site officiel','Réservation : voir le site officiel','Dernière mise à jour','Aucune description courte disponible. Consultez la page officielle pour les détails.'],
ne:['नारामा यो सप्ताहन्त','शनिबार, आइतबार र सोमबारका पारिवारिक कार्यक्रम।','यी कार्यक्रम सीमित सार्वजनिक स्रोतबाट स्वचालित रूपमा लिइएका हुन्, व्यक्तिगत रूपमा प्रमाणित छैनन्। समय, शुल्क, उमेर, बुकिङ र रद्द हुने सूचना आधिकारिक साइटमा जाँच्नुहोस्। सोमबार सधैं सार्वजनिक बिदा हुँदैन।','आधिकारिक पात्रो','थप कार्यक्रम आधिकारिक वेबसाइटमा हुन सक्छन्।','जडित स्रोतहरूमा यो सप्ताहन्तको कार्यक्रम भेटिएन। यसको मतलब कार्यक्रम नै छैन भन्ने होइन।','आधिकारिक विवरण →','समय: आधिकारिक साइटमा हेर्नुहोस्','शुल्क: आधिकारिक साइटमा हेर्नुहोस्','उमेर: आधिकारिक साइटमा हेर्नुहोस्','बुकिङ: आधिकारिक साइटमा हेर्नुहोस्','अन्तिम अपडेट','छोटो विवरण उपलब्ध छैन। थप जानकारीका लागि आधिकारिक पृष्ठ हेर्नुहोस्।'],
hi:['नारा में इस सप्ताहांत','शनिवार, रविवार और सोमवार के पारिवारिक कार्यक्रम।','ये कार्यक्रम सीमित सार्वजनिक स्रोतों से अपने आप लिए गए हैं, व्यक्तिगत रूप से सत्यापित नहीं हैं। समय, शुल्क, आयु, बुकिंग और रद्द होने की सूचना आधिकारिक वेबसाइट पर जाँचें। सोमवार हमेशा छुट्टी नहीं होती।','आधिकारिक कैलेंडर','अन्य कार्यक्रम आधिकारिक वेबसाइटों पर हो सकते हैं।','जुड़े स्रोतों में इस सप्ताहांत के कार्यक्रम नहीं मिले। इसका अर्थ यह नहीं है कि कोई कार्यक्रम नहीं है।','आधिकारिक विवरण →','समय: आधिकारिक साइट देखें','शुल्क: आधिकारिक साइट देखें','आयु: आधिकारिक साइट देखें','बुकिंग: आधिकारिक साइट देखें','आख़िरी अपडेट','संक्षिप्त विवरण उपलब्ध नहीं है। अधिक जानकारी के लिए आधिकारिक पेज देखें।']};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data={events:[]};let lang=localStorage.getItem('nk-lang')||'en';const picker=document.getElementById('lang');picker.value=lang;const format=s=>{if(!s)return'';return new Intl.DateTimeFormat(lang==='ht'?'fr':lang,{year:'numeric',month:'long',day:'numeric',timeZone:'Asia/Tokyo'}).format(new Date(s+'T12:00:00+09:00'))};const jstToday=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function labels(e){const now=jstToday();const status=e.end===now?'Ends today':e.start<=now?'Ongoing':'Upcoming';const cost=e.priceType==='free'||(e.costKnown&&e.free)?'Free':e.priceType==='mixed'?'Free + paid activities':e.priceType==='paid'?'Paid · check price':'Price unconfirmed';return `<div class="badges"><span class="badge ${status==='Ends today'?'ends':''}">${status}</span><span class="badge ${cost==='Free'?'free':'unknown'}">${cost}</span></div>`}
function render(){const t=T[lang]||T.en;document.documentElement.lang=lang;for(const [id,n] of [['heading',0],['tagline',1],['caution',2],['linksTitle',3],['linksText',4]])document.getElementById(id).textContent=t[n];document.getElementById('dates').textContent=(data.weekendStart?format(data.weekendStart)+' – '+format(data.weekendEnd):'');document.getElementById('status').textContent=t[11]+': '+(data.generatedAt?new Intl.DateTimeFormat(lang==='ht'?'fr':lang,{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Tokyo'}).format(new Date(data.generatedAt)):'—');document.getElementById('list').innerHTML=(data.events||[]).filter(e=>(e.end||e.start)>=jstToday()).map(e=>`<article class="card"><div class="meta">📍 ${esc(e.city||'Nara')} ${e.location?'· '+esc(e.location):''}</div><h3>${esc(e.translations?.[lang]?.title||e.title)}</h3>${labels(e)}<p class="detail">📅 ${esc(format(e.start))}${e.end&&e.end!==e.start?' – '+esc(format(e.end)):''}</p><p class="detail">${esc(e.translations?.[lang]?.description||e.description||t[12])}</p><p class="muted">🕒 ${esc(e.time||t[7])} · 💴 ${e.costKnown&&e.free?'Free / 無料':esc(t[8])}<br>👶 ${esc(e.age||t[9])} · 🎟️ ${esc(e.booking||t[10])}</p><span class="tag">${esc(e.provider||'Official source')} · Unverified / 未確認</span><p><a class="btn" href="${esc(e.url)}" rel="noopener noreferrer" target="_blank">${esc(t[6])}</a></p></article>`).join('')||`<div class="empty">${esc(t[5])}</div>`};picker.onchange=e=>{lang=e.target.value;localStorage.setItem('nk-lang',lang);render()};fetch('weekly.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(x=>{data=x;render()}).catch(()=>{render();document.getElementById('status').textContent='Weekly feed not generated yet / 週末情報はまだ生成されていません'});render();
</script></body></html>
