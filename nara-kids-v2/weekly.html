function eventCost(e,l){return e.priceType==='free'||(e.costKnown&&e.free)?l[6]:e.priceType==='mixed'?l[7]:e.priceType==='paid'?l[8]:l[9]}
function labels(e){const now=jstToday(),l=L[lang]||L.en,status=e.end===now?l[4]:e.start<=now?l[3]:l[5],cost=eventCost(e,l);return `<div class="badges"><span class="badge ${e.end===now?'ends':''}">${esc(status)}</span><span class="badge ${e.priceType==='free'?'free':'unknown'}">${esc(cost)}</span></div>`}
function card(e,t){const l=L[lang]||L.en,translated=e.translations?.[lang],desc=translated?.description||e.description||t[12];return `<article class="card"><div class="meta">📍 ${esc(e.city||'Nara')} ${e.location?'· '+esc(e.location):''}</div><h3>${esc(translated?.title||e.title)}</h3>${labels(e)}<p class="detail">📅 ${esc(format(e.start))}${e.end&&e.end!==e.start?' – '+esc(format(e.end)):''}</p><p class="detail">${esc(desc)}</p>${lang!=='ja'&&e.description&&!translated?.description?`<p class="lang-note">${esc(l[2])}</p>`:''}<p class="muted">🕒 ${esc(e.time||t[7])} · 💴 ${esc(eventCost(e,l))}<br>👶 ${esc(e.age||t[9])} · 🎟️ ${esc(e.booking||t[10])}</p><span class="tag">${esc(e.provider||'Official source')} · Unverified / 未確認</span><p><a class="btn" href="${esc(e.url)}" rel="noopener noreferrer" target="_blank">${esc(t[6])}</a></p></article>`}
function render(){const t=T[lang]||T.en,l=L[lang]||L.en;document.documentElement.lang=lang;for(const [id,n] of [['heading',0],['tagline',1],['caution',2],['linksTitle',3],['linksText',4]])document.getElementById(id).textContent=t[n];document.getElementById('dates').textContent=(data.weekendStart?format(data.weekendStart)+' – '+format(data.weekendEnd):'')+(data.holidayDates?.length?' · + '+data.holidayDates.map(format).join(', '):'');document.getElementById('status').textContent=t[11]+': '+(data.generatedAt?new Intl.DateTimeFormat(lang==='ht'?'fr':lang,{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Tokyo'}).format(new Date(data.generatedAt)):'—');let events=(data.events||[]).filter(e=>(e.end||e.start)>=jstToday());const special=events.filter(e=>e.section!=='ongoing'),ongoing=events.filter(e=>e.section==='ongoing');document.getElementById('list').innerHTML=events.length?`${special.length?`<h2 class="section-title">${esc(l[0])}</h2>${special.map(e=>card(e,t)).join('')}`:''}${ongoing.length?`<h2 class="section-title">${esc(l[1])}</h2>${ongoing.map(e=>card(e,t)).join('')}`:''}`:`<div class="empty">${esc(t[5])}</div>`}
picker.onchange=e=>{lang=e.target.value;localStorage.setItem('nk-lang',lang);render()};fetch('weekly.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(x=>{data=x;render()}).catch(()=>{render();document.getElementById('status').textContent='Weekly feed not generated yet / 週末情報はまだ生成されていません'});render();
